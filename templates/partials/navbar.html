{% load static %}
<!-- Navigation Header -->
<header class="fixed w-full top-0 z-50 shadow-lg border-b border-slate-200/70 text-slate-800" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px);">
    <div class="container mx-auto px-4 py-4 relative">
        <div class="flex justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <img src="{% static 'images/logo/distributed-db.svg' %}" alt="Lab2 project logo" class="h-12 w-12 rounded-2xl shadow-md ring-1 ring-white/20 object-contain">
                <a href="{% url 'index' %}" class="text-2xl font-bold text-slate-900 hover:text-teal-700 transition">Lab2 Project</a>
            </div>
            
            <div class="hidden md:flex space-x-6 items-center">
                <a href="{% url 'index' %}" class="hover:text-teal-700 transition">Home</a>
                <a href="{% url 'trips_list' %}" class="hover:text-teal-700 transition">Trips</a>
                <a href="{% url 'guides_list' %}" class="hover:text-teal-700 transition">Guides</a>
                <a href="{% url 'accommodations_list' %}" class="hover:text-teal-700 transition">Hotels</a>
                <a href="{% url 'events_list' %}" class="hover:text-teal-700 transition">Events</a>
                
                <!-- Admin Links -->
                {% if request.session.is_admin %}
                    <div class="border-l border-slate-200 pl-6 ml-6">
                        <a href="{% url 'admin_dashboard' %}" class="bg-teal-100 text-teal-800 px-3 py-2 rounded hover:bg-teal-200 transition">
                            <i class="fas fa-cog mr-2"></i>Admin Panel
                        </a>
                        <a href="{% url 'admin_logout' %}" class="text-rose-600 hover:text-rose-700 ml-2 transition">
                            <i class="fas fa-sign-out-alt"></i>Logout
                        </a>
                    </div>
                {% else %}
                    <a href="{% url 'admin_login' %}" class="bg-slate-100 text-slate-700 px-3 py-2 rounded text-sm hover:bg-slate-200 transition">
                        <i class="fas fa-lock mr-1"></i>Admin
                    </a>
                {% endif %}
            </div>
            
            <!-- Mobile menu button -->
            <button type="button" class="md:hidden text-slate-700" onclick="toggleMobileMenu()" aria-controls="mobile-menu" aria-expanded="false">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>

        <div id="mobile-menu" class="mobile-menu hidden md:hidden absolute left-4 right-4 top-full mt-3 rounded-2xl border border-slate-200 bg-white/95 p-4 shadow-2xl backdrop-blur" style="max-height: calc(100vh - 5rem); overflow-y: auto;">
            <div class="flex flex-col gap-2">
                <a href="{% url 'index' %}" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-teal-700">Home</a>
                <a href="{% url 'trips_list' %}" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-teal-700">Trips</a>
                <a href="{% url 'guides_list' %}" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-teal-700">Guides</a>
                <a href="{% url 'accommodations_list' %}" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-teal-700">Hotels</a>
                <a href="{% url 'events_list' %}" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-teal-700">Events</a>

                <div class="border-t border-slate-200 pt-2 mt-2">
                    {% if request.session.is_admin %}
                        <a href="{% url 'admin_dashboard' %}" class="flex items-center justify-between rounded-xl bg-teal-50 px-4 py-3 text-sm font-semibold text-teal-800 transition hover:bg-teal-100">
                            <span><i class="fas fa-cog mr-2"></i>Admin Panel</span>
                        </a>
                        <a href="{% url 'admin_logout' %}" class="mt-2 flex items-center justify-between rounded-xl bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700 transition hover:bg-rose-100">
                            <span><i class="fas fa-sign-out-alt mr-2"></i>Logout</span>
                        </a>
                    {% else %}
                        <a href="{% url 'admin_login' %}" class="flex items-center justify-between rounded-xl bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-200">
                            <span><i class="fas fa-lock mr-2"></i>Admin</span>
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</header>
